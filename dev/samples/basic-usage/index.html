<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordo - Basic Usage Sample</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 {
      color: #333;
    }
    .info {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    .console-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Nordo - Basic Usage Sample</h1>
  
  <div class="info">
    <strong>Purpose:</strong> This sample demonstrates the basic usage of the Nordo library.
    Open the browser console to see detailed logs.
  </div>

  <div>
    <button id="createBtn">Create Outbox</button>
    <button id="versionBtn">Show Version</button>
    <button id="clearBtn">Clear Output</button>
  </div>

  <div class="console-output" id="output">
    Console output will appear here...
  </div>

  <script type="module">
    // Import from the built distribution
    import { createOutbox, VERSION } from '../../../dist/index.js';

    const output = document.getElementById('output');
    
    function log(message, data = null) {
      const timestamp = new Date().toLocaleTimeString();
      let text = `[${timestamp}] ${message}`;
      if (data !== null) {
        text += '\n' + JSON.stringify(data, null, 2);
      }
      output.textContent += text + '\n\n';
      console.log(message, data);
    }

    // Initialize
    log('Nordo sample loaded');
    log('Library version:', VERSION);

    // Button handlers
    document.getElementById('createBtn').addEventListener('click', () => {
      const outbox = createOutbox();
      log('Created outbox instance:', outbox);
    });

    document.getElementById('versionBtn').addEventListener('click', () => {
      log('Nordo version:', VERSION);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      output.textContent = 'Console cleared...\n\n';
    });
  </script>
</body>
</html>
